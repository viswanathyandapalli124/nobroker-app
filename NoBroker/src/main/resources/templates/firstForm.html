<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Your Property</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        /* Reset and base styling */
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Sidebar styling */
        .sidebar {
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
        }

        .sidebar .nav-item {
            padding: 12px 16px;
            font-size: 15px;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .sidebar .nav-item strong {
            font-weight: bold;
            color: #00b386;
        }

        .sidebar .nav-item:hover {
            background-color: #f1f1f1;
        }

        /* Main form content */
        main {
            background-color: #ffffff;
            padding: 30px 40px;
            border-left: 1px solid #eee;
            min-height: 100vh;
        }

        h4 {
            font-weight: 600;
            color: #333;
        }

        /* Form styles */
        .form-group label {
            font-weight: 500;
            color: #444;
            margin-bottom: 4px;
        }

        .form-control {
            border-radius: 4px;
            box-shadow: none;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .input-group-text {
            background-color: #f0f0f0;
            border-radius: 0 4px 4px 0;
        }

        /* Alert box */
        .alert {
            background-color: #fff3cd;
            border-color: #ffeeba;
            color: #856404;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
        }

        /* "I’m interested" button */
        .btn-outline-success {
            color: #28a745;
            border-color: #28a745;
        }
        .btn-outline-success:hover {
            background-color: #28a745;
            color: white;
        }

        /* Save & Continue button */
        .btn-danger {
            background-color: #ff3e5b;
            border-color: #ff3e5b;
            font-weight: 500;
            padding: 8px 24px;
            font-size: 16px;
        }

        .btn-danger:hover {
            background-color: #e63450;
            border-color: #e63450;
        }

        /* Responsive tweak */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            main {
                padding: 20px;
            }
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block bg-light sidebar pt-4">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item"><strong>🏠 Property Details</strong></li>
                    <li class="nav-item">📍 Locality Details</li>
                    <li class="nav-item">💰 Rental Details</li>
                    <li class="nav-item">🏢 Amenities</li>
                    <li class="nav-item">🖼️ Gallery</li>
                    <li class="nav-item">📅 Schedule</li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main role="main" class="col-md-10 ml-sm-auto px-4">
            <h4 class="mt-4">Property Details</h4>
            <form th:action="@{/property/save}" th:object="${property}" method="post" class="mt-4">

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label>Apartment Type*</label>
                        <select class="form-control" th:field="*{propertyType}">
                            <option value="">Select</option>
                            <option>Apartment</option>
                            <option>Villa</option>
                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>BHK Type*</label>
                        <select class="form-control" th:field="*{bhkType}">
                            <option value="">Select</option>
                            <option value="1">1 BHK</option>
                            <option value="2">2 BHK</option>
                            <option value="3">3 BHK</option>
                        </select>
                    </div>

                    <div class="form-group col-md-2">
                        <label>Floor*</label>
                        <input type="number" class="form-control" th:field="*{floor}" min="0"/>
                    </div>

                    <div class="form-group col-md-2">
                        <label>Total Floor*</label>
                        <input type="number" class="form-control" th:field="*{totalFloors}" min="0"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-4">
                        <label>Property Age*</label>
                        <select class="form-control" th:field="*{propertyAge}">
                            <option value="">Select</option>
                            <option value="0">New</option>
                            <option value="1">1-3 years</option>
                            <option value="2">3-5 years</option>
                            <option value="3">5+ years</option>
                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>Facing</label>
                        <select class="form-control" th:field="*{facing}">
                            <option value="">Select</option>
                            <option>East</option>
                            <option>West</option>
                            <option>North</option>
                            <option>South</option>
                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>Built Up Area*</label>
                        <div class="input-group">
                            <input type="number" class="form-control" th:field="*{buildUpArea}" min="0"/>
                            <div class="input-group-append">
                                <span class="input-group-text">Sq.ft</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom section -->
                <div class="alert alert-warning text-center mt-3">
                    <span>📞 Don’t want to fill all the details? Let us help you!</span>
                    <button type="button" class="btn btn-outline-success ml-3">I’m interested</button>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-danger mt-3 px-5">Save & Continue</button>
                </div>
            </form>
        </main>
    </div>
</div>

</body>
</html>

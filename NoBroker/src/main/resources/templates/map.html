<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoBroker Header Clone</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 30px;
            height: 30px;
        }

        .brand-name {
            font-weight: bold;
            font-size: 20px;
            color: #000;
        }

        .menu-item {
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 600px;
            margin: 0 20px;
        }

        .search-section input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }

        .location-btn,
        .metro-btn,
        .search-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .location-btn {
            background-color: #f56d6d;
            color: #fff;
        }

        .metro-btn {
            background-color: #eee;
            color: #333;
        }

        .search-btn {
            background-color: #ff4c5b;
            color: #fff;
        }

        .save-search {
            margin-left: 10px;
            color: #007bff;
            text-decoration: underline;
            font-size: 14px;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pay-rent,
        .post-property {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .pay-rent {
            background-color: #fff;
            border: 1px solid #ccc;
            color: #333;
        }

        .post-property {
            background-color: #00aa9b;
            color: #fff;
        }

        .profile {
            padding: 5px 10px;
            border-radius: 20px;
            background-color: #e6e6e6;
            font-size: 14px;
        }

        .icons span {
            font-size: 18px;
            margin: 0 4px;
            cursor: pointer;
        }

        .menu {
            font-size: 18px;
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }

        .list-view,
        .map-view {
            padding: 6px 10px;
            border-radius: 15px;
            border: none;
            background-color: #00aa9b;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="left-section">
        <img src="https://static.thenounproject.com/png/1040629-200.png" alt="Logo" class="logo" />
        <span class="brand-name">NOBROKER</span>
        <div class="dropdown">
            <span class="menu-item">Buy ▾</span>
        </div>
    </div>

    <div class="right-section">
        <button class="pay-rent">Pay Rent</button>
        <button class="post-property">Post Your Property</button>
        <div class="profile">Pakkurthi Chandu ▾</div>
        <div class="icons">
            <span>♡</span>
            <span>🔔</span>
        </div>
        <div class="menu">☰ Menu</div>
        <div class="view-toggle">
            <button class="list-view">List</button>
            <button class="map-view">Map</button>
        </div>
    </div>
</header>

</body>
</html>
